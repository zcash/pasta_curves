name: Lean

# Always triggers, so the required `Lean CI` check is always reported (a workflow skipped by
# `on.paths` would leave a required check pending and block merges). The jobs are instead gated
# on a path filter computed inside the run, since they are irrelevant to a change that provably
# cannot affect the formalization. Erring toward running keeps a change from dodging the checks
# by touching a file that the filter did not anticipate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Lean-relevant changes
    runs-on: ubuntu-latest
    outputs:
      lean: ${{ steps.filter.outputs.lean }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dorny/paths-filter compiles each rule to its own picomatch matcher and ORs them, so a
      # change is Lean-relevant iff some changed file is outside the set that cannot affect
      # the formalization, or is one of the crate's sources that the generator reads (the
      # backend's blocks and tests, and the field types' constants), or is this workflow.
      # Note this is NOT the sequential-negation semantics of GitHub's own `on.paths` engine.
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            lean:
              - '!{book/**,benches/**,sage/**,src/**,.github/**,scripts/**,Cargo.toml,Cargo.lock,rust-toolchain.toml,*.md,LICENSE-*,ruff.toml,katex-header.html}'
              - 'src/asm/**'
              - 'src/fields/**'
              - '.github/workflows/lean.yml'

  build:
    name: Build the formalization (lake)
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain from `lean/lean-toolchain`, fetches the Mathlib cache, and
      # runs `lake build`; warnings fail the build.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          build-args: --wfail

  transcription:
    name: Transcription and proof skeletons are current
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Regenerates the Lean transcription and the vectors from the crate's own assembly and
      # inline blocks, fails if they differ from the committed files, and checks that the
      # generated parts of the proofs are the current skeletons.
      - name: Regenerate and compare
        run: lean/scripts/check.sh

  checker-tests:
    name: The export-axiom checker's own tests
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checker the nanoda job runs is what makes "no `sorry` and no `native_decide`"
      # a machine-checked claim, so it gets its own tests: a checker that silently stops
      # detecting something turns a green job into evidence of nothing. Stdlib only, so
      # there is nothing to install and this reports without building the library.
      - name: Run the checker's tests
        working-directory: lean
        run: python3 -m unittest discover -s scripts -p 'test_check_export_axioms.py' -v

  # Re-checks the library with nanoda, an independent reimplementation of the Lean kernel
  # (see lean/scripts/check_nanoda.sh). A separate job so `build` reports quickly; this one
  # starts only after a green build, and its `lake build` restores the build cache that job
  # saved, so it verifies rather than rebuilds.
  nanoda:
    name: An independent kernel accepts the build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
      - name: Build lean4export at the pinned toolchain's tag
        working-directory: lean
        run: |
          TOOLCHAIN=$(cat lean-toolchain)
          git clone --depth 1 --branch "${TOOLCHAIN##*:}" \
            https://github.com/leanprover/lean4export work/lean4export
          cd work/lean4export && lake build
      - name: Build nanoda at the pinned revision
        working-directory: lean
        run: |
          git clone --depth 1 \
            --revision=3a2407216ee84a75f9e1aead6803d0578be06ae7 \
            https://github.com/ammkrn/nanoda_lib work/nanoda_lib
          cargo build --release --manifest-path work/nanoda_lib/Cargo.toml
      - name: Export the library and re-check it
        working-directory: lean
        run: |
          scripts/check_nanoda.sh work/lean4export/.lake/build/bin/lean4export \
            work/nanoda_lib/target/release/nanoda_bin

  lean-ci:
    # The single stable check to mark as a required status check. It runs unless the workflow run
    # was cancelled, and fails only if a job that ran failed. `nanoda` needs `build`, so it is
    # skipped with it.
    name: Lean CI
    needs: [changes, build, transcription, checker-tests, nanoda]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the jobs' results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RESULTS: >-
            build=${{ needs.build.result }}
            transcription=${{ needs.transcription.result }}
            checker-tests=${{ needs.checker-tests.result }}
            nanoda=${{ needs.nanoda.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "The changes-detection job did not succeed."
            exit 1
          fi
          status=0
          for result in $RESULTS; do
            case "${result#*=}" in
              success|skipped) echo "$result" ;;
              *) echo "$result: failed"; status=1 ;;
            esac
          done
          exit "$status"
