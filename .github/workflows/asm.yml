name: Assembly backend

# The checks specific to the assembly backend under `src/asm`; `ci.yml` builds and tests the
# crate on Apple silicon, Ubuntu, and Windows in both feature configurations.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test the backend on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon.
        os: [ubuntu-24.04-arm, macos-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm the runner is Apple AArch64
        if: ${{ matrix.os == 'macos-latest' }}
        # If GitHub ever moves macos-latest back to x86_64, the backend would
        # compile out and every check below would pass vacuously.
        run: test "$(uname -sm)" = "Darwin arm64"
      - name: Test the backend (debug, with the debug assertions)
        run: cargo test --verbose --features asm 'asm::'
      - name: Confirm every test of the backend ran, in both profiles
        shell: bash
        # A cfg-gated test that silently compiles out still reports success,
        # so count the `#[test]` functions under `src/asm` and require the
        # run of the module's tests to report exactly that many passed. A test
        # added to the module then raises the expectation by itself.
        run: |
          expected=$(grep -rh '^\s*#\[test\]' src/asm | wc -l | tr -d ' ')
          echo "tests in the backend: $expected"
          test "$expected" -gt 0
          for profile in "" --release; do
            out=$(cargo test $profile --features asm 'asm::' 2>&1)
            echo "$out"
            echo "$out" | grep -q "^test result: ok. $expected passed"
          done
      - name: With the assembly disabled, the crate's tests pass and the backend has none to run
        shell: bash
        env:
          RUSTFLAGS: --cfg pasta_curves_noasm
        run: |
          cargo build --verbose --all-features
          for profile in "" --release; do
            out=$(cargo test $profile --all-features 2>&1)
            echo "$out"
            if printf '%s\n' "$out" | grep -E '^test asm::'; then
              exit 1
            fi
          done
      - name: Verify working directory is clean
        run: git diff --exit-code

  no-std:
    name: no_std, with no std to fall back on
    # `#![no_std]` keeps std out of the crate's own code, but the target the
    # backend compiles on has a std to link, so build core from source instead
    # of using the sysroot: nothing that reaches for std can compile.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install a nightly toolchain with the library sources
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Build against core alone
        run: |
          cargo +nightly build --verbose --release --no-default-features --features asm \
            -Z build-std=core,compiler_builtins --target aarch64-apple-darwin

  intel-macos:
    name: No backend on Intel macOS
    # Apple x86-64 targets reserve `rbp`, and so have fewer available registers
    # than the squaring blocks need; the `asm` module compiles out there instead
    # of failing to build.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm the runner is Intel
        run: test "$(uname -sm)" = "Darwin x86_64"
      - name: Build
        run: cargo build --verbose --all-features
      - name: The backend has no tests to run (debug and release)
        shell: bash
        run: |
          for profile in "" --release; do
            out=$(cargo test $profile --all-features 'asm::' 2>&1)
            echo "$out"
            if printf '%s\n' "$out" | grep -E '^running [1-9]'; then
              exit 1
            fi
          done
