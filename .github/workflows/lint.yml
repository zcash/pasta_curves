name: Lint scripts

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck is preinstalled on the Ubuntu runner images.
      - name: Lint the shell scripts
        run: shellcheck --version && shellcheck scripts/*.sh lean/scripts/*.sh book/edithtml.sh

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned by version and by the hashes of the published wheels, so a new ruff release
      # cannot fail an unrelated change and the pinned release cannot be swapped underneath;
      # the rules are in ruff.toml. The environment lives outside the checkout so that
      # `ruff check .` does not lint it.
      - name: Install ruff, hash-pinned
        run: |
          python3 -m venv "$RUNNER_TEMP/lint-venv"
          "$RUNNER_TEMP/lint-venv/bin/pip" install --require-hashes -r scripts/lint-requirements.txt
      - name: Lint the Python scripts
        run: '"$RUNNER_TEMP/lint-venv/bin/ruff" check .'
      - name: Check the Python scripts' formatting
        run: '"$RUNNER_TEMP/lint-venv/bin/ruff" format --check .'

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned by version and by the SHA-256 of the release archive, from the release's
      # checksums file, as ruff is pinned by its wheels' hashes. actionlint runs the
      # preinstalled shellcheck over each `run:` script.
      - name: Install actionlint, hash-pinned
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
