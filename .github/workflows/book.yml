name: Pasta book

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tool without a prebuilt binary is compiled, and the crate's
      # `rust-toolchain.toml` pins a toolchain too old for mdBook 0.5's crates,
      # so any such compile uses the current stable instead.
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install mdbook and plugins
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          tool: mdbook@0.5.4,mdbook-katex@0.10.0

      - name: Build Pasta book
        run: mdbook build
        working-directory: book

      - name: Upload built book
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book
          path: ./book/book

  deploy:
    name: Deploy the book to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the built book to the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built book
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: book
          path: ./book/book

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/book
