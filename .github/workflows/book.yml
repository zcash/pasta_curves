name: Pasta book

# Always triggers, so the required `Pasta book CI` check is always reported (a
# workflow skipped by `on.paths` would leave a required check pending and block
# merges). The build and deployment are instead gated on a path filter computed
# inside the run, since they are irrelevant to a change that does not touch what
# the book is built from.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  changes:
    name: Detect book-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      book: ${{ steps.filter.outputs.book }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The book is built from `book/` and the root README, which
      # `book/src/README.md` includes; a new include of another file must be
      # added here. The blueprint it publishes is built from `blueprint/` and the
      # Lean package, and links to and checks names in `src/asm/`.
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            book:
              - 'book/**'
              - 'blueprint/**'
              - 'lean/**'
              - 'src/asm/**'
              - 'README.md'
              - '.github/workflows/book.yml'

  build:
    name: Build the book
    needs: changes
    if: needs.changes.outputs.book == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tool without a prebuilt binary is compiled, and the crate's
      # `rust-toolchain.toml` pins a toolchain too old for mdBook 0.5's crates,
      # so any such compile uses the current stable instead.
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install mdbook and plugins
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          tool: mdbook@0.5.4,mdbook-katex@0.10.0

      - name: Build Pasta book
        run: mdbook build
        working-directory: book

      # The blueprint of the inversion's proof (blueprint/README.md), published
      # beside the book at `blueprint/`. LeanArchitect extracts its nodes from
      # the Lean build; its tooling is pinned with hashes, and pygraphviz builds
      # against the system graphviz. Its source links are pinned to the commit
      # being built.
      - name: Extract the blueprint from the Lean build
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          build-args: PastaCurvesBlueprint:blueprint
          test: false
          lint: false

      - name: Install the blueprint's tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz libgraphviz-dev
          python3 -m venv "$RUNNER_TEMP/blueprint-venv"
          "$RUNNER_TEMP/blueprint-venv/bin/pip" install --require-hashes \
            -r blueprint/requirements.txt

      - name: Build the blueprint
        run: |
          REF="$GITHUB_SHA" SKIP_LAKE=1 \
            PLASTEX="$RUNNER_TEMP/blueprint-venv/bin/plastex" blueprint/build.sh
          cp -R blueprint/web book/book/blueprint

      - name: Upload built book
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book
          path: ./book/book

  deploy:
    name: Deploy the book to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the built book to the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built book
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: book
          path: ./book/book

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/book

  book-ci:
    # The single stable check to mark as a required status check. It runs
    # unless the workflow run was cancelled, and fails only if the book build
    # actually failed.
    name: Pasta book CI
    needs: [changes, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the build result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "The changes-detection job did not succeed."
            exit 1
          fi
          case "$BUILD_RESULT" in
            success|skipped)
              echo "Book build passed or was not required for this change." ;;
            *)
              echo "Book build result: $BUILD_RESULT."
              exit 1 ;;
          esac
