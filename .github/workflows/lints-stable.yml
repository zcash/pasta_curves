name: Stable lints

# We only run these lints on trial-merges of PRs to reduce noise.
on: pull_request

jobs:
  clippy:
    name: Clippy (MSRV)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      checks: write # post Clippy annotations as a check run

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run clippy
        uses: auguwu/clippy-action@9817d076b82df0194935be9db6154c56ac07b317 # 1.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # cargo-level flags go in `check-args` (before the `--`); lint levels
          # go in `deny`/`warn` (the action places them after the `--`).
          check-args: --all-features --all-targets
          deny: warnings

  clippy-aarch64-asm:
    name: Clippy (Apple AArch64 assembly backend)
    timeout-minutes: 30
    # The gated backend is compiled out everywhere else, so the ubuntu clippy
    # job above never lints a line of it.
    runs-on: macos-latest
    permissions:
      contents: read # check out the repository

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run clippy
        run: cargo clippy --all-targets --features aarch64-asm -- -D warnings
