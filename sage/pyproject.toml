[project]
name = "pasta-curves-sage"
version = "0.0.0"
description = "SageMath scripts deriving the constants used by this crate"
requires-python = ">=3.11"
dependencies = [
    # passagemath is the pip-installable distribution of SageMath; the
    # exact versions are pinned in uv.lock.
    "passagemath-standard ~= 10.8.6",
    "passagemath-repl ~= 10.8.6",
]

[tool.uv]
package = false

[dependency-groups]
format = ["ruff ~= 0.16.6"]
test = ["pytest ~= 9.1"]
typecheck = ["mypy ~= 2.3", { include-group = "test" }]

[tool.ruff]
line-length = 80

[tool.mypy]
python_version = "3.11"
strict = true
files = ["asm_aarch64.py", "asm_mutant_witnesses.py", "tests"]
