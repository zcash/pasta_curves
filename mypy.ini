# Type checking for the Lean generator (lean/scripts/): its compiler (asm2lean/), the crate's
# configuration (pasta/), its command line, and its tests. Strict: every function is annotated
# and nothing is implicitly Any. Run by CI and by scripts/ci.sh, as `mypy` from the repository
# root; the version is pinned in scripts/lint-requirements.txt.
[mypy]
python_version = 3.10
strict = True
mypy_path = lean/scripts
files =
    lean/scripts/gen.py,
    lean/scripts/asm2lean,
    lean/scripts/pasta,
    lean/scripts/test_gen.py,
    lean/scripts/test_vectors.py,
    lean/scripts/test_asm_source.py
